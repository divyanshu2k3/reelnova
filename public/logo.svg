<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant Mesh Gradient -->
    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FBFF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A000FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF007A;stop-opacity:1" />
    </linearGradient>

    <!-- Glass Overlay Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:white;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:white;stop-opacity:0.05" />
    </linearGradient>

    <!-- Professional Glow -->
    <filter id="premiumGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-15px) rotate(2deg); }
      }
      @keyframes shine {
        0% { stop-offset: -100%; }
        100% { stop-offset: 200%; }
      }
      @keyframes morphInitial {
        0% { opacity: 0; transform: scale(0.5) rotate(-20deg); }
        100% { opacity: 1; transform: scale(1) rotate(0deg); }
      }
      .logo-main {
        animation: morphInitial 1.5s cubic-bezier(0.19, 1, 0.22, 1) forwards, float 4s ease-in-out infinite 1.5s;
        transform-origin: center;
      }
      .nova-spark {
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50% { transform: scale(1.5); opacity: 1; }
      }
    </style>
  </defs>

  <!-- Background (Removed for transparency in tabs) -->

  <!-- Background Decorative Rings -->
  <circle cx="256" cy="256" r="220" stroke="url(#mainGrad)" stroke-width="1" opacity="0.1" />
  <circle cx="256" cy="256" r="190" stroke="url(#mainGrad)" stroke-width="1" opacity="0.1" />

  <g class="logo-main">
    <!-- Abstract "RN" Brand Symbol (Fluidic & Interlocking) -->
    <!-- The "R" curve blends into the Play Button Triangle -->
    <g filter="url(#premiumGlow)">
      <!-- Stylized Column (Common for R and N) -->
      <rect x="140" y="140" width="48" height="232" rx="24" fill="url(#mainGrad)" />
      
      <!-- The "R" Loop / Play Button Hybrid -->
      <path d="M188 140H280C340 140 340 230 280 230H188" fill="url(#mainGrad)" opacity="0.9" />
      <path d="M188 140H280C340 140 340 230 280 230H188" stroke="white" stroke-width="2" opacity="0.3" />
      
      <!-- The "R" Leg / "N" Bridge -->
      <path d="M240 230L340 372" stroke="url(#mainGrad)" stroke-width="48" stroke-linecap="round" />
      
      <!-- The "N" Side Column -->
      <rect x="340" y="140" width="48" height="232" rx="24" fill="url(#mainGrad)" />
      
      <!-- Glass Highlight -->
      <path d="M140 140H280C340 140 340 200 310 220" stroke="url(#glassGrad)" stroke-width="12" stroke-linecap="round" opacity="0.5" />
    </g>

    <!-- The "Nova" Core (The unique identifier) -->
    <g class="nova-spark" transform="translate(256, 256)">
      <circle r="20" fill="white" filter="url(#premiumGlow)" />
      <path d="M-15 0H15M0 -15V15" stroke="black" stroke-width="4" stroke-linecap="round" />
    </g>
  </g>

  <!-- Floating Particles -->
  <circle cx="100" cy="100" r="4" fill="#00FBFF" opacity="0.4">
    <animate attributeName="cy" values="100;80;100" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="412" cy="412" r="4" fill="#FF007A" opacity="0.4">
    <animate attributeName="cy" values="412;432;412" dur="4s" repeatCount="indefinite" />
  </circle>
</svg>
